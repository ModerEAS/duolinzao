services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: duolinzao
      POSTGRES_PASSWORD: duolinzao
      POSTGRES_DB: duolinzao
    ports:
      - "5432:5432"
    volumes:
      - duolinzao-pg:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DUOLINZAO_CONFIG: /config/config.toml
    volumes:
      - ./config.toml:/config/config.toml:ro
      - duolinzao-images:/var/lib/duolinzao/images

volumes:
  duolinzao-pg:
  duolinzao-images:
