name: CI

# PR：跑全部测试 + build 镜像（不推 GHCR）。
# master / v* tag：跑全部测试，测试通过后才 build 并 push 到 ghcr.io/moderras/duolinzao。
# 注意：镜像名必须全小写，所以是 moderras 而不是 ModerRAS。
on:
  push:
    branches: [master, "ci/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/moderras/duolinzao

jobs:
  test:
    name: 后端测试（cargo test + 一期集成测试）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Actions 里没有 peer 套接字，走 TCP；测试库由测试自己 CREATE DATABASE。
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/duolinzao_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: 系统依赖（webauthn-rs → openssl-sys 需要 pkg-config + libssl-dev）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      - name: clippy
        run: cargo clippy --all-targets
      - name: cargo test
        run: cargo test

  e2e:
    name: 浏览器测试（Playwright + Postgres + app）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: duolinzao
          POSTGRES_PASSWORD: duolinzao
          POSTGRES_DB: duolinzao
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U duolinzao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://duolinzao:duolinzao@127.0.0.1:5432/duolinzao
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e
      - name: 系统依赖（openssl-sys 与 Playwright 浏览器）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - name: 构建前端（app 的 static_dir 指向 web/dist）
        run: cd web && npm ci && npm run build
      - name: 构建后端
        run: cargo build
      - name: 安装 Playwright
        run: cd e2e && npm ci && npx playwright install --with-deps chromium
      - name: 起栈并跑浏览器测试
        run: bash scripts/e2e.sh
      - name: 失败时上传浏览器报告（截图 / trace / video）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: 失败时上传后端日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-app-log
          path: |
            e2e/app.log
            e2e/.tmp/config.toml
          if-no-files-found: ignore
          retention-days: 7

  e2e-scale:
    name: 规模化旅程 smoke（@scale，3 食堂 × 30 人）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: duolinzao
          POSTGRES_PASSWORD: duolinzao
          POSTGRES_DB: duolinzao
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U duolinzao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://duolinzao:duolinzao@127.0.0.1:5432/duolinzao
      DLZ_SCALE: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e-scale
      - name: 系统依赖（openssl-sys 与 Playwright 浏览器）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - name: 构建前端（app 的 static_dir 指向 web/dist）
        run: cd web && npm ci && npm run build
      - name: 构建后端
        run: cargo build
      - name: 安装 Playwright
        run: cd e2e && npm ci && npx playwright install --with-deps chromium
      - name: 起栈并跑规模化旅程（DLZ_SCALE=smoke）
        run: bash scripts/e2e.sh
      - name: 失败时上传浏览器报告（截图 / trace / video）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-scale
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: 失败时上传后端日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-scale-app-log
          path: |
            e2e/app.log
            e2e/.tmp/config.toml
          if-no-files-found: ignore
          retention-days: 7

  image:
    name: 构建镜像（仅 master / v* 推 GHCR）
    runs-on: ubuntu-latest
    needs: [test, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 校验 docker compose 可解析
        run: |
          cp config.docker.example.toml config.docker.toml
          docker compose -f docker-compose.yml config -q
      - name: 登录 GHCR
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 生成 tag / label
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
      - name: build（PR 只 build；master / v* 才 push）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
