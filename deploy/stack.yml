# 多邻灶 Docker Swarm 生产栈：app + Postgres，Traefik 入口。
# 开源仓库只放通用配置：域名、entrypoint、certresolver、外部网络名、部署路径
# 全部变量化（见下表），默认值仅供本地 `config` 校验，生产由 CI vars 注入。
#
#   DLZ_DOMAIN=${DLZ_DOMAIN:-example.com}
#   TRAEFIK_ENTRYPOINT=${TRAEFIK_ENTRYPOINT:-web}
#   TRAEFIK_CERTRESOLVER=${TRAEFIK_CERTRESOLVER:-letsencrypt}
#   TRAEFIK_NETWORK=${TRAEFIK_NETWORK:-traefik-public}
#   CONFIG_VERSION=deploy/config.toml 的 sha256 前 12 位（CI 算好传入；本地手测用 dev）
#
# 持久数据用 bind mount：各节点只需 ${DEPLOY_PATH} 目录存在，挂到容器 /srv/duolinzao，
# 子目录 pgdata/ 与 images/ 由容器启动时自建并设权限（无需 SSH 到 worker）。
# DEPLOY_PATH 无默认值，部署时必须注入（CI 从 secrets.DEPLOY_PATH 注入）。
#
# 用法（manager 上，DEPLOY_PATH 内）：IMAGE_TAG=sha-xxx DLZ_DOMAIN=... \
#   docker stack deploy -c stack.yml --with-registry-auth duolinzao
# 校验：docker compose -f deploy/stack.yml config（带与不带变量各一次）。
# 首次准备见 docs/deploy.md.

configs:
  duolinzao_config:
    name: duolinzao_config_${CONFIG_VERSION:-dev}
    file: ./config.toml

secrets:
  dlz_db_password:
    external: true
  dlz_database_url:
    external: true
  dlz_super_password:
    external: true
  dlz_local_key:
    external: true
  dlz_smtp_password:
    external: true

networks:
  traefik-public:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-public}
  duolinzao-internal:
    driver: overlay
    internal: true

# 持久数据用 bind mount（用户选 A）：实际路径由 DEPLOY_PATH 拼出
# （容器内 /srv/duolinzao/{pgdata,images}），部署时必须注入该变量（CI 已注入）。
# 不用命名卷：数据目录在宿主机可见，备份即 tar 文件夹。

services:
  db:
    image: postgres:16
    networks:
      - duolinzao-internal
    environment:
      POSTGRES_USER: duolinzao
      POSTGRES_DB: duolinzao
      POSTGRES_PASSWORD_FILE: /run/secrets/dlz_db_password
      # 只挂 DEPLOY_PATH 父目录：官方镜像 entrypoint（root）会自建 PGDATA 并 chown 999、chmod 700。
      PGDATA: /srv/duolinzao/pgdata
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30"]
    volumes:
      - ${DEPLOY_PATH}:/srv/duolinzao
    secrets:
      - dlz_db_password
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.duolinzao.role==db
      resources:
        limits:
          memory: 448M
        reservations:
          memory: 256M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
      # db 用 start-first：新 db 起来后再停旧的，overlay 上 `db` VIP 不断；
      # 否则与 app 同次发版时 app 起来到一半 `db` 短名不可解析，直接 exit 1。
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: pause
        monitor: 60s
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        order: start-first
        monitor: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duolinzao"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    image: ghcr.io/moderras/duolinzao:${IMAGE_TAG:-latest}
    networks:
      - traefik-public
      - duolinzao-internal
    environment:
      DUOLINZAO_CONFIG: /config/config.toml
      DLZ_DATABASE_URL_FILE: /run/secrets/dlz_database_url
      DLZ_SUPER_PASSWORD_FILE: /run/secrets/dlz_super_password
      DLZ_LOCAL_KEY_FILE: /run/secrets/dlz_local_key
      DLZ_SMTP_PASSWORD_FILE: /run/secrets/dlz_smtp_password
      DLZ_WEBAUTHN_RP_ID: ${DLZ_DOMAIN:-example.com}
      DLZ_WEBAUTHN_ORIGIN: https://${DLZ_DOMAIN:-example.com}
    configs:
      # source 指顶层 configs 的 key；实际对象名由上面的 name（含 CONFIG_VERSION）决定，
      # 配置一改名一变，stack deploy 即触发服务更新。
      - source: duolinzao_config
        target: /config/config.toml
    secrets:
      - dlz_database_url
      - dlz_super_password
      - dlz_local_key
      - dlz_smtp_password
    # 只挂 DEPLOY_PATH 父目录（各节点只需该目录存在）。以 root 启动仅做 mkdir/chown，
    # 随即 setpriv 降权到 nobody(65534) 运行应用。
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /srv/duolinzao/images && chown 65534:65534 /srv/duolinzao/images && exec setpriv --reuid=65534 --regid=65534 --clear-groups /app/duolinzao
    volumes:
      - ${DEPLOY_PATH}:/srv/duolinzao
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.duolinzao.role==app
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
        failure_action: rollback
        monitor: 90s
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 60s
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.duolinzao.rule=Host(`${DLZ_DOMAIN:-example.com}`)"
        - "traefik.http.routers.duolinzao.entrypoints=${TRAEFIK_ENTRYPOINT:-web}"
        - "traefik.http.routers.duolinzao.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
        - "traefik.http.services.duolinzao.loadbalancer.server.port=8080"
        - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik-public}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s

